name: Scratch CK Settings sidebar a11y
# Temporary branch (deleted after use): builder CK's base and head builds for the Settings sidebar
# screen-reader check: Windows (UI Automation, on the runner) and macOS (artifacts for the Mac mini's
# AX check). Nothing ships.

on:
  push:
    branches: [ci/ck-a11y*]

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  CK_BASE: ee85b90dfd5fa55265fbb6bd8227d9362b890327
  CK_HEAD: 477cf62451f5ab5d8ac1bcfd0b832d3432646acf

jobs:
  windows-build:
    name: Windows build ${{ matrix.which }}
    strategy:
      matrix:
        which: [base, head]
    runs-on: blacksmith-8vcpu-windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ matrix.which == 'base' && env.CK_BASE || env.CK_HEAD }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: ./.github/actions/setup-rust-cache
        with:
          target: x86_64-pc-windows-msvc
          prefix-key: v1-rust-meetings
          save-cache: "false"
          workspaces: apps/desktop-gpui -> target
      - shell: bash
        run: node scripts/setup.js
        env:
          RUST_TARGET_TRIPLE: x86_64-pc-windows-msvc
      - shell: bash
        run: |
          node scripts/sync-desktop-versions.mjs
          ./scripts/prepare-gpui-dependency.sh
      - shell: bash
        run: cargo +1.95.0 build --manifest-path apps/desktop-gpui/Cargo.toml --locked --release --bin cap-gpui
      - shell: bash
        run: |
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage/gpui-windows-shaders"
          cp apps/desktop-gpui/target/release/cap-gpui.exe "$stage/"
          cp target/release/*.dll "$stage/"
          cp target/native-deps/vcruntime/*.dll "$stage/" 2>/dev/null || true
          cp ../zed-cap/crates/gpui_windows/src/*.hlsl "$stage/gpui-windows-shaders/"
          printf '%s' "$GITHUB_WORKSPACE" > "$stage/build-workspace.txt"
          printf '%s' "$(cd ../zed-cap && pwd -W)" > "$stage/build-zed.txt"
          git rev-parse HEAD > "$stage/commit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ck-a11y-win-${{ matrix.which }}
          path: ${{ runner.temp }}/stage
          retention-days: 2

  windows-check:
    name: Windows UIA ${{ matrix.os }}
    needs: windows-build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ck-a11y-win-head
          path: ${{ runner.temp }}/head
      - uses: actions/download-artifact@v4
        with:
          name: ck-a11y-win-base
          path: ${{ runner.temp }}/base
      - name: Put the builds' source files back at their paths
        shell: pwsh
        run: |
          foreach ($dir in "$env:RUNNER_TEMP\head", "$env:RUNNER_TEMP\base") {
            $workspace = (Get-Content "$dir\build-workspace.txt" -Raw).Trim()
            if ($workspace -ne $env:GITHUB_WORKSPACE -and -not (Test-Path $workspace)) {
              New-Item -ItemType Directory -Force (Split-Path $workspace) | Out-Null
              cmd /c mklink /J "$workspace" "$env:GITHUB_WORKSPACE"
            }
            $shaders = Join-Path (Get-Content "$dir\build-zed.txt" -Raw).Trim() "crates\gpui_windows\src"
            New-Item -ItemType Directory -Force $shaders | Out-Null
            Copy-Item -Force "$dir\gpui-windows-shaders\*.hlsl" $shaders
            "$dir $(Get-Content "$dir\commit.txt")"
          }
      - name: Sidebar through UI Automation
        shell: pwsh
        run: |
          $w = "$env:RUNNER_TEMP\a11y"; New-Item -ItemType Directory -Force $w | Out-Null
          foreach ($arm in 'base', 'head') { & .ckw/sidebar.ps1 -Bin "$env:RUNNER_TEMP\$arm\cap-gpui.exe" -Tag "sidebar-$arm" -Work $w }
          Get-Content "$w\summary.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ck-a11y-uia-${{ matrix.os }}
          path: ${{ runner.temp }}/a11y
          retention-days: 3

